name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: ShellCheck & syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bash syntax check
        run: |
          set -e
          for f in *.sh; do
            echo "bash -n $f"
            bash -n "$f"
          done

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          severity: warning

  docker-build:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build test image (no secrets, build only)
        run: |
          docker build \
            --build-arg AUTH_KEYS_URL_ARG="placeholder" \
            --build-arg ZROK_TOKEN_ARG="placeholder" \
            -t kagglelink-ci .
